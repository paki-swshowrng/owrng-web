<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OWRNG Web</title>
<style>
html,body{
margin:0;
background:#111;
color:white;
font-family:sans-serif;
text-align:center;
touch-action:manipulation;
}
header{
background:#222;
padding:15px;
font-size:28px;
display:flex;
align-items:center;
}
#menuButton{
font-size:30px;
background:none;
border:none;
color:white;
margin-right:15px;
touch-action:manipulation;
}
#menu{
position:fixed;
top:0;
left:-250px;
width:250px;
height:100%;
background:#222;
transition:.3s;
padding-top:70px;
z-index:10; 
}
 #overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
display:none;
z-index:5;
}
#menu button{
width:100%;
padding:20px;
font-size:22px;
border:none;
background:none;
color:white;
text-align:left;
touch-action:manipulation;
}
.page{display:none;padding:20px}
.active{display:block}

#bitsInput{
width:34ch;
height:90px;
padding:4px;
font-family:monospace;
font-size:16px;
line-height:1.2;
white-space:pre;
overflow:auto;
resize:none;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
touch-action:manipulation;
}

.bitButtons button{
width:120px;
height:120px;
font-size:50px;
margin:10px;
border:none;
border-radius:20px;
}

.actionButton{
margin-top:20px;
padding:15px 30px;
font-size:24px;
border:none;
border-radius:10px;
}

input{
width:90%;
max-width:700px;
padding:15px;
font-size:20px;
border:none;
border-radius:10px;
}

#counter,#result,#tsvResult{
margin-top:20px;
font-size:24px;
}
</style>
</head>
<body>

<header>
<button id="menuButton" onclick="toggleMenu()">☰</button>
OWRNG Web
</header>

<div id="menu">
<button onclick="showPage('seedPage')">Seed計算</button>
<button onclick="showPage('tsvPage')">TSV計算</button>
</div>
<div id="overlay"
onclick="closeMenu()">
</div>
 
<div id="seedPage" class="page active">
<h2>Seed計算</h2>

<textarea id="bitsInput"></textarea>

<div id="counter">0 / 128</div>

<div class="bitButtons">
<button onclick="appendBit('0')">0</button>
<button onclick="appendBit('1')">1</button>
</div>

<button class="actionButton" onclick="removeBit()">1文字戻す</button>
<br>
<button class="actionButton" onclick="calculateSeed()">Seed特定</button>

<div id="result">結果がここに表示されます</div>
<hr>

<h2>現在位置特定(開発中)</h2>

<p>検索開始</p>
<input id="rangeMin" value="0">

<p>検索終了</p>
<input id="rangeMax" value="10000">

<p>0/1入力</p>
<textarea id="currentBits"></textarea>

<button
class="actionButton"
onclick="calculateCurrent()">
現在位置特定
</button>

<div id="currentResult">
結果がここに表示されます
</div>

<div id="tsvPage" class="page">
<h2>TSV計算</h2>
<p>TID</p>
<input id="tid">
<p>SID</p>
<input id="sid">
<br>
<button class="actionButton" onclick="calculateTSV()">TSV計算</button>
<div id="tsvResult">結果がここに表示されます</div>
</div>

<script>
function toggleMenu(){

 const m =
 document.getElementById("menu");

 const o =
 document.getElementById("overlay");

 if(m.style.left==="0px"){

   m.style.left="-250px";
   o.style.display="none";

 }else{

   m.style.left="0px";
   o.style.display="block";
 }
}

 function closeMenu(){

 document.getElementById("menu")
 .style.left="-250px";

 document.getElementById("overlay")
 .style.display="none";
}
 
function showPage(id){
 seedPage.classList.remove("active");
 tsvPage.classList.remove("active");
 document.getElementById(id).classList.add("active");
 closeMenu();
}

function getBits(){
 return bitsInput.value.replace(/[^01]/g,"").slice(0,128);
}

function setBits(bits){
 let lines=[];
 for(let i=0;i<bits.length;i+=32){
   lines.push(bits.slice(i,i+32));
 }
 bitsInput.value=lines.join("\n");
 counter.textContent=bits.length+" / 128";
}

function appendBit(bit){
 let bits=getBits();
 if(bits.length>=128)return;
 bits+=bit;
 setBits(bits);
}

function removeBit(){
 let bits=getBits();
 setBits(bits.slice(0,-1));
}

bitsInput.addEventListener("input",()=>{
 setBits(getBits());
});

function calculateSeed(){

 let bits = getBits();

 if(bits.length !== 128){

   result.innerHTML =
     "128bit入力してください";
   return;
 }

 let rng = reverseBits(bits);

 let s0 =
   rng.s0
   .toString(16)
   .toUpperCase()
   .padStart(16,"0");

 let s1 =
   rng.s1
   .toString(16)
   .toUpperCase()
   .padStart(16,"0");

 result.innerHTML =
   "state[0]<br>" +
   s0 +
   "<br><br>" +
   "state[1]<br>" +
   s1;
}

function calculateTSV(){
 const tid=parseInt(document.getElementById("tid").value);
 const sid=parseInt(document.getElementById("sid").value);

 if(isNaN(tid)||isNaN(sid)){
   tsvResult.innerHTML="TIDとSIDを入力してください";
   return;
 }
 tsvResult.innerHTML="TSV : "+((tid^sid)>>4);
}

const MASK64 = (1n << 64n) - 1n;

function rotl(x,k){
return (((x << BigInt(k)) & MASK64) |
(x >> BigInt(64-k))) & MASK64;
}

function rotr(x,k){
return ((x >> BigInt(k)) |
((x << BigInt(64-k)) & MASK64)) & MASK64;
}

class Xoroshiro128p{

constructor(s0,s1){
this.s0=BigInt(s0);
this.s1=BigInt(s1);
}

setState(s0,s1){
this.s0=BigInt(s0)&MASK64;
this.s1=BigInt(s1)&MASK64;
}

getRand(){

const num=this.s0;
const num2=num^this.s1;

const result=
(this.s0+this.s1)&MASK64;

this.s0=
(rotl(num,24)^
num2^
((num2<<16n)&MASK64))
&MASK64;

this.s1=rotl(num2,37);

return result;
}

back(n=1){

for(let step=0;step<n;step++){

 let num3=this.s0;
 let num4=this.s1;

 let t=
   rotr(
     (
       num3 ^
       ((rotl(num4,27)<<16n)&MASK64)
     )&MASK64,
     24
   ) ^ rotl(num4,3);

 t&=MASK64;

 this.s0=t;

 this.s1=
  (t^rotl(num4,27))
  &MASK64;

}
}
}

 Xoroshiro128p.prototype.advance = function(n=1){

 if(n < 0){

   for(let i=0;i<Math.abs(n);i++){
     this.back(1);
   }

   return;
 }

 for(let i=0;i<n;i++){
   this.getRand();
 }
}
 
class Matrix{

constructor(row,col){

this.mat =
Array.from(
{length:row},
()=>Array(col).fill(false)
);
}

getElement(r,c){
return this.mat[r][c];
}

setElement(r,c,v){
this.mat[r][c]=v;
}

addRows(src,dst){

for(let i=0;i<this.mat[0].length;i++){

 this.mat[dst][i] ^=
   this.mat[src][i];

}
}

swapRows(i,j){

for(let k=0;k<this.mat[0].length;k++){

 let t=this.mat[i][k];

 this.mat[i][k]=
   this.mat[j][k];

 this.mat[j][k]=t;

}
}

addColumns(src,dst){

for(let i=0;i<this.mat.length;i++){

 this.mat[i][dst] ^=
   this.mat[i][src];

}
}

swapColumns(i,j){

for(let k=0;k<this.mat.length;k++){

 let t=this.mat[k][i];

 this.mat[k][i]=
   this.mat[k][j];

 this.mat[k][j]=t;

}
}
mulMatrix(b){

 let matrix =
   new Matrix(
     this.mat.length,
     b.mat[0].length
   );

 if(
   this.mat[0].length !==
   b.mat.length
 ){
   return matrix;
 }

 let length=this.mat.length;
 let length2=b.mat[0].length;
 let length3=this.mat[0].length;

 for(let i=0;i<length;i++){

   for(let j=0;j<length2;j++){

     for(let k=0;k<length3;k++){

       matrix.mat[i][j] ^=
         (
           this.mat[i][k] &&
           b.mat[k][j]
         );
     }
   }
 }

 return matrix;
}inverse(){

let matrix =
new Matrix(
this.mat.length,
this.mat[0].length
);

let matrix2 =
new Matrix(
this.mat.length,
this.mat[0].length
);

let length=this.mat.length;

for(let i=0;i<length;i++){

matrix.mat[i][i]=true;

for(let j=0;j<length;j++){

 matrix2.mat[i][j]=
   this.mat[i][j];

}
}

let num=0;
let list=[];

for(let k=0;k<length;k++){

for(let l=num;l<length;l++){

 if(matrix2.mat[k][l]){

   for(let m=0;m<length;m++){

     if(
       m!==l &&
       matrix2.mat[k][m]
     ){

       matrix2.addColumns(l,m);
       matrix.addColumns(l,m);
     }
   }

   matrix2.swapColumns(l,num);
   matrix.swapColumns(l,num);

   list.push(k);

   num++;

   break;
 }

}
}

for(
let n=list.length-1;
n>=0;
n--
){

let i2=list[n];

matrix.swapColumns(i2,n);
}

return matrix;
}
}

function toXoroshiro128(matrix){

let s0 = 0n;
let s1 = 0n;

for(let i=0;i<64;i++){

if(matrix.getElement(i,0)){

 s0 |= (1n << BigInt(i));

}
}

for(let j=0;j<64;j++){

if(matrix.getElement(j+64,0)){

 s1 |= (1n << BigInt(j));

}
}

return new Xoroshiro128p(
s0,
s1
);
}
 function createLowBits(){

let lowbits = new Matrix(128,128);

let rng =
new Xoroshiro128p(
0n,
0n
);

for(let l=0;l<128;l++){

let num2 =
1n <<
BigInt(l % 64);

if(l < 64){

 rng.setState(
   num2,
   0n
 );

}else{

 rng.setState(
   0n,
   num2
 );

}

for(let m=0;m<128;m++){

 let test =
   new Xoroshiro128p(
     rng.s0,
     rng.s1
   );

 for(
   let n=0;
   n<m;
   n++
 ){
   test.getRand();
 }

 let num3 =
   test.getRand() & 1n;

 lowbits.setElement(
   m,
   l,
   num3 > 0n
 );

}
}

return lowbits;
}
const low = createLowBits();
const lowInv = low.inverse();
function reverseBits(bitString){

let matrix =
new Matrix(128,1);

for(let i=0;i<64;i++){

if(bitString[i] === "1"){

 matrix.setElement(
   i,
   0,
   true
 );

}

if(bitString[i+64] === "1"){

 matrix.setElement(
   i+64,
   0,
   true
 );

}
}

let matrix2 =
lowInv.mulMatrix(
matrix
);

let rng =
toXoroshiro128(
matrix2
);

for(
let j=0;
j<bitString.length;
j++
){

rng.getRand();
}

return rng;
}


 setBits("");
 function calculateCurrent(){

 document.getElementById(
   "currentResult"
 ).innerHTML =
 "動作確認OK";
}
</script>

</body>
</html>
