<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OWRNG Web</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;}
header{background:#222;padding:15px;font-size:28px;display:flex;align-items:center}
#menuButton{font-size:30px;background:none;border:none;color:#fff;margin-right:15px;touch-action:manipulation}
#menu{position:fixed;top:0;left:-250px;width:250px;height:100%;background:#222;transition:.3s;padding-top:70px;z-index:1000}
#menu button{width:100%;padding:20px;font-size:22px;border:none;background:none;color:#fff;text-align:left}
.page{display:none;padding:20px}
.active{display:block}
#bitsDisplay{
width:90%;max-width:700px;height:180px;margin:0 auto;
padding:15px;background:#fff;color:#000;border-radius:10px;
font-size:20px;text-align:left;white-space:pre-wrap;overflow-y:auto;
word-break:break-all;
}
input{
width:90%;max-width:700px;padding:15px;
font-size:20px;border:none;border-radius:10px;margin-top:10px;
}
.bitButtons{margin-top:20px}
.bitButtons button{
width:120px;height:120px;font-size:50px;margin:10px;
border:none;border-radius:20px;touch-action:manipulation;
}
.actionButton{
margin-top:20px;padding:15px 30px;font-size:24px;
border:none;border-radius:10px;touch-action:manipulation;
}
#counter,#result,#tsvResult{margin-top:20px;font-size:24px}
</style>
</head>
<body>

<header>
<button id="menuButton" onclick="toggleMenu()">☰</button>
OWRNG Web
</header>

<div id="menu">
<button onclick="showPage('seedPage')">Seed計算</button>
<button onclick="showPage('tsvPage')">TSV計算</button>
</div>

<div id="seedPage" class="page active">
<h2>Seed計算</h2>
<p>128bit</p>

<div id="bitsDisplay"></div>

<div id="counter">0 / 128</div>

<div class="bitButtons">
<button onclick="addBit('0')">0</button>
<button onclick="addBit('1')">1</button>
</div>

<button class="actionButton" onclick="removeBit()">1文字戻す</button>
<br>
<button class="actionButton" onclick="calculateSeed()">Seed特定</button>

<div id="result">結果がここに表示されます</div>
</div>

<div id="tsvPage" class="page">
<h2>TSV計算</h2>

<p>TID</p>
<input id="tid">

<p>SID</p>
<input id="sid">

<br>
<button class="actionButton" onclick="calculateTSV()">TSV計算</button>

<div id="tsvResult">結果がここに表示されます</div>
</div>

<script>
let bits="";

function toggleMenu(){
 const m=document.getElementById("menu");
 m.style.left=(m.style.left==="0px")?"-250px":"0px";
}

function showPage(id){
 document.getElementById("seedPage").classList.remove("active");
 document.getElementById("tsvPage").classList.remove("active");
 document.getElementById(id).classList.add("active");
 document.getElementById("menu").style.left="-250px";
}

function refreshBits(){
 let text="";
 for(let i=0;i<bits.length;i+=32){
   text += bits.slice(i,i+32);
   if(i+32<bits.length) text += "\n";
 }
 document.getElementById("bitsDisplay").textContent=text;
 document.getElementById("counter").textContent=bits.length+" / 128";
}

function addBit(bit){
 if(bits.length>=128)return;
 bits+=bit;
 refreshBits();
}

function removeBit(){
 bits=bits.slice(0,-1);
 refreshBits();
}

document.addEventListener("keydown",function(e){
 if(e.key==="0") addBit("0");
 else if(e.key==="1") addBit("1");
 else if(e.key==="Backspace"){
   e.preventDefault();
   removeBit();
 }
});

function calculateSeed(){
 document.getElementById("result").innerHTML=
 "入力bit数 : "+bits.length+"<br><br>Seed特定機能は開発中";
}

function calculateTSV(){
 const tid=parseInt(document.getElementById("tid").value);
 const sid=parseInt(document.getElementById("sid").value);

 if(isNaN(tid)||isNaN(sid)){
   document.getElementById("tsvResult").innerHTML="TIDとSIDを入力してください";
   return;
 }

 const tsv=((tid^sid)>>4);
 document.getElementById("tsvResult").innerHTML="TSV : "+tsv;
}

refreshBits();
</script>

</body>
</html>
